[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reflective-vla"
version = "0.1.0"
description = "Reflective VLA (arXiv:2606.25215) on top of LeRobot pi0.5"
requires-python = ">=3.12"
dependencies = ["lerobot", "torch", "numpy"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
